# FIXED CLIENT TEXT 1 — footer of every page.
general_disclaimer: "This website exists to introduce Memowell® and to provide scientific and educational information about memory health and cognitive function. It does not replace diagnosis, advice or treatment from your own doctor. Talk to a doctor or pharmacist about which product suits your situation and how to use it."

# FIXED CLIENT TEXT 2 — end of /memowell and /who-its-for.
product_disclaimer: "Take Memowell® according to the directions on the packaging approved in the country where you bought it. If you take medicines or other supplements, have an underlying condition, or are pregnant or breastfeeding, speak to a doctor or pharmacist before starting. Do not change prescribed medicines without consulting your doctor. Keep out of reach of children."

