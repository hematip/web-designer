    heading: "سياسة الخصوصية"
    body: |-
      تحترم كوندور فارما خصوصية الزوّار. عند تعبئة نموذج التواصل أو الاشتراك في النشرة الإخبارية، نتلقّى معلومات مثل الاسم والبريد الإلكتروني ونص رسالتك للرد عليك وتقديم الخدمات المطلوبة. يتم إرسال الرسائل التسويقية بموافقتك، وتتوفّر إمكانية إلغاء الاشتراك. يُرجى عدم إرسال معلومات طبية حساسة أو مستندات علاجية عبر النموذج العام للموقع.

      في حال استخدام أدوات تحليل الزيارات أو ملفات تعريف الارتباط، يُوضَّح في الموقع نوع الأداة والغرض من استخدامها وخيارات إدارتها. يقتصر الوصول إلى المعلومات على الأشخاص ومقدّمي الخدمات الذين يحتاجون إليها لتقديم خدمات الموقع. تُحفَظ المعلومات لمدة تتناسب مع الغرض من تلقّيها ومع المتطلبات القانونية. لطلب الاطلاع على معلوماتك أو تصحيحها أو حذفها، استخدم وسيلة التواصل المذكورة في صفحة «اتصل بنا». يعمل هذا الموقع على التعريف بـ ‎Memowell®‎ وتقديم معلومات علمية وتثقيفية. ولا يعني استخدام محتواه الحصول على استشارة طبية خاصة أو نشوء علاقة بين طبيب ومريض. يجب مطابقة معلومات المنتج مع الملصق المعتمد في بلد الشراء.

      تعود حقوق المحتوى الخاص والصور والتصميم والعلامات التجارية إلى أصحابها القانونيين. ولا يُسمح بالاستخدام التجاري لهذه المواد أو إعادة نشرها دون إذن صاحب الحق. تُقدَّم روابط المصادر الخارجية لإتاحة الوصول إلى معلومات إضافية، وتقع مسؤولية محتوى تلك الصفحات على ناشريها. قد يُحدَّث محتوى الموقع عند ورود معلومات علمية أو متطلبات جديدة. للاستفسار عن المحتوى أو استخدامه، يُرجى التواصل عبر صفحة «اتصل بنا».
