    marquee: ["Memory health", "90 vegetarian capsules", "Gluten-free", "K-Vie™ boswellic acids", "Made by Kondor Pharma in Canada", "NPN 80107357"]

  - id: why
    heading: "One thing researchers are looking at: inflammation in the nervous system"
    body: |-
      In Alzheimer's disease, researchers have linked inflammation in the nervous system to a build-up of protein. That build-up disrupts how nerve cells communicate with each other. It is associated with the changes families often notice first: forgetting names, losing the thread of a conversation, repeating a question.

      This is an area of active research, not a settled answer.
    # Plain-language home (client direction 2026-11-08): no DOI or reading link here; the source is cited on
    # /memory-health (article "inflammation in the nervous system") and /science/professionals.
    # Illustrative photography (AI-generated in Higgsfield from the client's "dr" character element). Needs client approval: see README.
    photo:
      src: "/img/photos/researcher-lab"
      width: 1600
      height: 1853
      widths: [640, 1024, 1600]
      focus: "60% 35%"
      alt: ""

  - id: formulation
    # v6 3D story (K-Vie™ → a look inside at AKBA → capsule). Plain-language labels and bodies for a general
    # audience (client direction 2026-11-08); the technical terms stay on /memowell and /science/professionals.
    heading: "What's inside each capsule"
    chapters:
      - label: "Ground extremely fine"
        body: "The active compounds in frankincense, called boswellic acids, are hard for the body to absorb. Kondor Pharma grinds them extremely fine into an ingredient called K-Vie™ to help with that."
      - label: "Formed into tiny crystals"
        body: "The fine powder is then formed into tiny, even crystals."
      - label: "40% active compounds"
        body: "K-Vie™ is made so that 40% of it is boswellic acids."
      - label: "A closer look: AKBA"
        body: "AKBA is one of the boswellic acids. This is its shape."
      - label: "Vegetarian and gluten-free"
        body: "Each bottle holds 90 vegetarian capsules."
    actions:
      - { label: "More about what's inside", href: "/memowell#composition" }

  - id: who
    # Client direction 2026-11-03: Memowell was studied in two populations (Alzheimer's disease; post-TBI memory
    # problems). The four groups below are where the research may be relevant, so the section no longer says they
    # were "studied"; the two study populations sit in a small fact line. Brief Part 4, HOME §4.
    heading: "Who it's for"
    items:
      - { title: "Mild cognitive impairment (MCI)", body: "A change in memory or thinking that can progress toward Alzheimer's disease." }
      - { title: "A first-degree relative with Alzheimer's", body: "Family history raises the risk. That is not a forecast, just a reason to pay attention earlier." }
      - { title: "Brain fog and delirium", body: "Confusion, trouble concentrating and memory lapses, where inflammation has been studied as a factor." }
      - { title: "From mid-life onward", body: "Risk rises with age, and the changes behind it can begin in mid-life." }
    body: |-
      Five situations come up again and again in research on memory. Find the one closest to yours and read what research says about it, in plain language.
    fact: "Memowell has been studied in people with Alzheimer's disease and in people with memory problems after a brain injury."
    inline_action: { label: "Read about all five", href: "/who-its-for" }

  - id: evidence
    # Plain-language pass (client direction 2026-11-08). The figure keeps its population, duration, comparison and
    # source (journal and year, in words) inside the same panel; the DOI and study design live on /science and
    # /science/professionals. MMSE scores run from 0 to 30.
    heading: "What the research found"
    lead: "Memowell has been tested in three published studies. The largest followed 85 people with mild to moderate Alzheimer's disease for six months."
    eyebrow: "The main result"
    # The large figure shown in the result panel (must appear in Body), and the words beside it.
    highlight: "3.11"
    unit: "points higher on a memory test"
    body: |-
      After six months, people who took Memowell alongside their usual treatment scored 3.11 points higher on a 30-point memory test than people who took a dummy capsule.

      The test, called the MMSE, is one doctors use to check memory and orientation.

      Two more studies looked at blood tests, and at 80 people with memory problems after a brain injury.
    items:
      - { title: "85 people", body: "with mild to moderate Alzheimer's" }
      - { title: "6 months", body: "alongside their usual treatment" }
      - { title: "A fair test", body: "chance decided who took Memowell and who took a dummy capsule" }
      - { title: "Published", body: "in the journal Alzheimer's & Dementia, 2023" }
    actions:
      - { label: "Read all three studies", href: "/science" }

  - id: directions
    heading: "How to take it"
    lead: "One capsule with each of your three main meals."
    items:
      - { title: "Breakfast", body: "One capsule" }
      - { title: "Lunch", body: "One capsule" }
      - { title: "Dinner", body: "One capsule" }
    # Title of the eight-week panel.
    eyebrow: "Give it eight weeks"
    body: |-
      Taking it with food helps the body absorb the compounds.

      Use it regularly for eight weeks before you judge the effect.

      Take it under your doctor's supervision, especially if you also take prescribed medicines.
    actions:
      - { label: "Full directions, cautions and storage", href: "/memowell#directions" }

