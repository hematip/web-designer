meta_description: "Memowell® is a dietary supplement for memory and cognitive health. See who it's for and what the research found, then talk it through with your doctor."
sections:
  - id: hero
    heading: "Reaching for names a little more often lately?"
    # The answer to the heading, in the voice of the hero film ("the wall of names"); set larger than the body.
    lead: "Behind every name is someone you love. Noticing a change is a good reason to understand it, and to talk it through with your doctor."
    body: |-
      Memowell® is a dietary supplement for memory and cognitive health, made by Kondor Pharma.
    actions:
      - { label: "Who it's for", href: "/who-its-for" }
      - { label: "What the research found", href: "/science" }
    trust: "Licensed by Health Canada · NPN 80107357"
    # Design fields (v2). accent = word set in the italic accent face (no words change).
    # marquee = fragments of approved copy and the bottle label, decorative (aria-hidden). Flagged in README.
