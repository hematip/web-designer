meta_title: "Memowell® — Memory Health Supplement | Kondor Pharma"
meta_description: "Memowell® is a dietary supplement for memory and cognitive health. See who it was studied in and what the research found, then talk it through with your doctor."
sections:
  - id: hero
    heading: "Reaching for names a little more often lately?"
    # The answer to the heading, in the voice of the hero film ("the wall of names"); set larger than the body.
    lead: "Behind every name is someone you love. Noticing a change is a good reason to understand it, and to talk it through with your doctor."
    body: |-
      Memowell® is a dietary supplement for memory and cognitive health, made by Kondor Pharma.
    actions:
      - { label: "Who it was studied in", href: "/who-its-for" }
      - { label: "What the research found", href: "/science" }
    trust: "Licensed by Health Canada · NPN 80107357"
    # Design fields (v2). accent = word set in the italic accent face (no words change).
    # marquee = fragments of approved copy and the bottle label, decorative (aria-hidden). Flagged in README.
    accent: "names"
    marquee: ["Memory health", "90 vegetarian capsules", "Gluten-free", "K-Vie™ boswellic acids", "Made by Kondor Pharma in Canada", "NPN 80107357"]

  - id: why
    heading: "One thing researchers are looking at: inflammation in the nervous system"
    body: |-
      In Alzheimer's disease, researchers have linked inflammation in the nervous system to a build-up of protein. That build-up disrupts how nerve cells communicate with each other. It is associated with the changes families often notice first: forgetting names, losing the thread of a conversation, repeating a question.

      This is an area of active research, not a settled answer.
    inline_action: { label: "Read more about memory health", href: "/memory-health" }
    sources: ["10.1186/s12974-020-01820-6"]
    # Illustrative photography (AI-generated, Kondor Brain + Higgsfield). Needs client approval: see README.
    photo:
      src: "/img/photos/caregiver-planner"
      width: 1600
      height: 2000
      widths: [640, 1024, 1600]
      focus: "50% 48%"
      alt: ""

  - id: formulation
    # v6: one chapter per stage of the 3D scene, K-Vie™ → AKBA → capsule (client direction 2026-10-26).
    # Chapter bodies are whole sentences of the copy deck (brief Part 4, HOME §3); labels are short fragments. Do not reword.
    heading: "Boswellic acids, in a formulation built for absorption"
    chapters:
      - label: "Micronized"
        body: "Boswellic acids are poorly absorbed in the digestive system. Kondor Pharma developed K-Vie™, a micronized, microcrystalline form standardised to 40% boswellic acids, to address that."
      - label: "Microcrystalline"
      - label: "K-Vie™ · standardised to 40% boswellic acids"
      - label: "AKBA · acetyl-11-keto-β-boswellic acid"
        body: "AKBA is one of the boswellic acids."
      - label: "Vegetarian and gluten-free"
        body: "One bottle holds 90 vegetarian capsules."
    actions:
      - { label: "More about the formulation", href: "/memowell#composition" }

  - id: who
    heading: "Who it was studied in"
    items:
      - { title: "Mild cognitive impairment (MCI)", body: "A change in memory or thinking that can progress toward Alzheimer's disease." }
      - { title: "A first-degree relative with Alzheimer's", body: "Family history roughly doubles the risk compared with people who have none." }
      - { title: "Brain fog and delirium", body: "Confusion, trouble concentrating and memory lapses, where inflammation has been studied as a factor." }
      - { title: "Approaching 65", body: "Risk rises with age, and brain atrophy can begin in mid-life." }
    body: |-
      Each of these has been studied. None of them is a diagnosis you can make from a website.
    inline_action: { label: "See the full picture", href: "/who-its-for" }

  - id: evidence
    heading: "What the research found"
    body: |-
      In a six-month trial published in *Alzheimer's & Dementia*, 85 people with Alzheimer's disease took either Memowell or a placebo alongside their prescribed care. At six months, the Memowell group scored 3.11 points higher on MMSE — a standard test of memory and orientation — than the placebo group.

      Two further studies looked at blood markers and at 80 people with cognitive difficulty after a brain injury.
    sources: ["10.1002/alz.063660"]
    # Typographic emphasis only: this phrase is highlighted inside its own sentence (context stays intact).
    highlight: "3.11 points higher on MMSE"
    actions:
      - { label: "Read all three studies", href: "/science" }
      - { label: "For healthcare professionals", href: "/science/professionals" }

  - id: directions
    heading: "How it is taken"
    body: |-
      One capsule with each of the three main meals. Taken with food, the compounds are better absorbed.

      Give it eight weeks of regular use before judging the effect, and take it under your doctor's supervision — particularly alongside prescribed medicines.
    actions:
      - { label: "Full directions, cautions and storage", href: "/memowell#directions" }

  - id: professionals
    lead: "Are you a doctor, pharmacist or dietitian?"
    body: "The professional section has the study designs, full results tables, composition, and a form to send a scientific question to our scientific affairs team."
    actions:
      - { label: "Go to the professional section", href: "/science/professionals" }

