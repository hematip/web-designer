  - id: composition
    heading: "Composition and administration"
    body: |-
      **Active:** K-Vie™ *Boswellia* extract, standardised to 40% boswellic acids, micronized and microcrystalline.

      **Presentation:** 90 vegetarian capsules per bottle. Gluten-free.

      **Administration:** one capsule with each of the three main meals, taken with food. Effects on cognitive symptoms are generally observed after approximately eight weeks of regular use.

      **Contraindicated** in pregnancy and lactation.

      **Advise caution** in hepatic or renal disease, cardiovascular disease, haematological disorders and autoimmune conditions. Mild gastrointestinal symptoms have been reported at initiation.

      Product information must be read against the label approved in the country of purchase.

  - id: monitoring
    heading: "Following response"
    body: |-
      The published work used MMSE at six-month intervals, and tracked the neutrophil-to-lymphocyte ratio on CBC differential as a marker of inflammatory activity. Whether either is appropriate for a given patient is a clinical judgement.

  - id: case-reports
    heading: "Case reports"
    body: |-
      Five published case reports describe patients aged 59 to 83 with Alzheimer's disease. Dosing in these reports varied and in some cases exceeded the label directions. They are individual observations, not controlled evidence.
    actions:
      - { label: "Read the five case reports", href: "/science/professionals/case-reports", kind: case-reports }

  - id: question-form
    heading: "Ask a scientific question"
    body: |-
      Questions go to Kondor Pharma scientific affairs in Canada. Answers come by email within three to five working days, with sources.
    form: scientific

  - id: feedback-form
    heading: "Report what you observed"
    body: |-
      If you have prescribed or dispensed Memowell, what you saw is useful to us.
    form: feedback
